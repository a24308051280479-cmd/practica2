<!-- Declara que este documento es HTML5 y ayuda al navegador a mostrarlo correctamente -->
<!DOCTYPE html>

<!-- Etiqueta raíz que envuelve toda la página; 'lang="en"' indica que el idioma principal es inglés -->
<html lang="en">
<head>
    <!-- Define la codificación de caracteres como UTF-8 para aceptar tildes y eñes -->
    <meta charset="UTF-8">
    
    <!-- Configura la escala de la página para que se adapte bien a pantallas de celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título de la pestaña del navegador -->
    <title>Imagenes en HTML</title>
</head>
<body>
    <!-- Encabezado principal de la página -->
    <h2>Imagenes en HTML</h2>

    <!-- Subtítulo para la sección de imágenes locales -->
    <h3>Locales</h3>
    <!-- Muestra una imagen guardada en la misma carpeta que el archivo HTML -->
    <img src="caritas.png" alt="Imagen de carita feliz">

    <!-- Subtítulo para la sección de imágenes locales con tamaño modificado -->
    <h3>Locales redismensionado</h3>
    <!-- Muestra una imagen local forzando un ancho de 200px y un alto de 100px -->
    <img src="imagenes/carita.png" alt="" width="200" height="100">

    <!-- Subtítulo para la sección de imágenes cargadas desde la web -->
    <h3>Desde internet</h3>
    <!-- Muestra una imagen estática usando una URL de internet con tamaño de 200x200px -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" width="200" height="200" alt="">

    <!-- Subtítulo para la sección de animaciones -->
    <h3>Animaciones</h3>
    <!-- Muestra un archivo GIF animado desde un enlace externo con tamaño de 200x200px -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" width="200" height="200" alt="">
</body>
</html>
