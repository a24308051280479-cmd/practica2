<!DOCTYPE html>
<!-- Declaración que indica al navegador que este documento sigue el estándar HTML5 -->
<html lang="en">
<!-- Etiqueta raíz que contiene todo el código de la página (el atributo lang="en" establece el idioma inglés) -->

<head>
    <!-- Contenedor de metadatos, título y configuraciones del sitio web -->
    
    <!-- Define la codificación UTF-8 para procesar correctamente acentos y caracteres especiales -->
    <meta charset="UTF-8">
    
    <!-- Configura la escala y visualización responsiva para dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Define el título que aparece en la pestaña del navegador -->
    <title>Salto de linea en HTML</title>
</head>

<body>
    <!-- Cuerpo del documento: contiene todo el contenido visible para el usuario -->

    <!-- Encabezado o título de nivel 1 (el principal de la página) -->
    <h1>Lenguaje de programacion</h1>

    <!-- Párrafo principal de texto -->
    <p>En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:
        
        <!-- <br> realiza un salto de línea manual dentro del mismo párrafo sin crear uno nuevo -->
        <br>
        Dart<br>      <!-- Salta a la siguiente línea -->
        Flutter<br>   <!-- Salta a la siguiente línea -->
        Python<br>    <!-- Salta a la siguiente línea -->
        Ruby<br>      <!-- Salta a la siguiente línea -->
        Java<br>      <!-- Salta a la siguiente línea -->
        TypeScript<br><!-- Salta a la siguiente línea -->
        Entre otros.
    </p>
</body>

</html>
